<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiderman</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="upper-text">
            <h5>See All</h5>
            <h2>Explore Art Work</h2>
        </div>
        <div class="cards">
            <div class="card-container1">
                <div class="card1">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThfp6RMqDsXDZXBZfgZds3o8-nCnq5ZwClxn0XuD3zyQ&s"
                        alt="idk">

                    <div class="info">
                        <h4>Monocular</h4>
                        <span class="likes">54.8k <i>&#9825;</i></span>
                    </div>

                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card2">
                    <img src="https://i1.sndcdn.com/avatars-Kx1MGjSByKEYG1nX-lfJ7tg-t1080x1080.jpg" alt="idk">

                    <div class="info">
                        <h4>Horns Mask</h4>
                        <span class="likes">32.4k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card3">
                    <img src="https://i.pinimg.com/236x/9a/ec/c1/9aecc14e8215fc5d954d4f45512c2c65.jpg" alt="idk">

                    <div class="info">
                        <h4>Light Moon</h4>
                        <span class="likes">86.6k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card4">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT47kAgX7dwhgEH2hzv0P_kX8QM9ABm1AZI6SQ7lCl6d9jE4WmAu325573C&s=10"
                        alt="female-skeleton">
                    <div class="info">
                        <h4>Skull Wire</h4>
                        <span class="likes">78.9k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
            </div>
            <div class="card-container2">
                <div class="card1">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQVOzbBDrc53x3e684KKHVW_c5ZQZ1GHMLyOHJglMkrLw&s"
                        alt="spiderman">

                    <div class="info">
                        <h4>Spiderman</h4>
                        <span class="likes">24.8k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card2">
                    <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcRPj1-6pjougTH5LCnEA9d2eCvxjLNTPm0EiZ0EtkTjkCc7i1Hf"
                        alt="spiderman">

                    <div class="info">
                        <h4>DeadPool</h4>
                        <span class="likes">59.7k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card3">
                    <img src="https://i.pinimg.com/236x/42/3e/1b/423e1b076afe42652d62652a2fa812b4.jpg" alt="face">

                    <div class="info">
                        <h4>White Eye</h4>
                        <span class="likes">45.7k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
                <div class="card4">
                    <img src="https://i.pinimg.com/236x/7c/49/08/7c4908147c4c620726852661e3dac49e.jpg"
                        alt="plastic-skeleton">

                    <div class="info">
                        <h4>Plastic Spinal</h4>
                        <span class="likes">98.6k <i>&#9825;</i></span>
                    </div>
                    <button class="bid-btn">Place Bid</button>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
