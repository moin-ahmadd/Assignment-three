<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid-Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="logo">
                <img src="images/logo.png" alt="logo">
            </div>
            <div class="links">
                <a href="#">About</a>
                <a href="#">Watch now</a>
                <a href="#">Actors</a>
                <a href="#">Conact</a>
            </div>
            <div class="menu">
                <img src="images/menu-icon-v2.svg" alt="menu">
            </div>
        </nav>
        <section class="section-1">
            <div class="left">
                <img class="name-img" src="images/logo.png" alt="name-image">
                <p class="meta">Action / Thriller / Drama Series directrd by Dong-hyuk Hwang<br>Season 1: 9 Episodes</p>
                <div class="btns">
                    <button class="btn1">
                        <img src="images/video-play-icon-11386.png" alt="play-button">
                        Play Now
                    </button>
                    <button class="btn2">
                        <img src="images/video-play-icon-11386.png" alt="play-button">
                        Watch Trailer
                    </button>

                </div>
                <h1>GAME</h1>
            </div>
            <div class="scroll">
                <span>SCROLL</span>
                <div class="line"></div>
            </div>
            <div class="right">
                <img class="player-img" src="images/player.png" alt="player-image">
                <div class="social-links">
                    <img src="images/social-image.png" alt="social-image">
                </div>
                <h1>SQUID</h1>
            </div>
        </section>
        <section class="section-2">
            <div class="cards">
                <div class="card1">
                    <img class="thumb" src="images/image1.jpg" alt="image1">
                    <img class="video-player" src="images/video-play-icon-11386.png" alt="vedoi-player">
                </div>
                <div class="card2">
                    <img class="thumb" src="images/image2.jpg" alt="image2">
                    <img class="video-player" src="images/video-play-icon-11386.png" alt="vedoi-player">
                </div>
                <div class="card3">
                    <img class="thumb" src="images/image3.jpg" alt="image3">
                    <img class="video-player" src="images/video-play-icon-11386.png" alt="vedoi-player">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
